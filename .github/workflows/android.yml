name: Android APK
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore optional stable TEST signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LEXSA_TEST_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LEXSA_TEST_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LEXSA_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LEXSA_TEST_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lexsa-test.jks"
            {
              echo "LEXSA_KEYSTORE=$RUNNER_TEMP/lexsa-test.jks"
              echo "LEXSA_STORE_PASSWORD=$STORE_PASSWORD"
              echo "LEXSA_KEY_ALIAS=$KEY_ALIAS"
              echo "LEXSA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo '::warning::No stable test signing secret. This APK uses an ephemeral debug key; updates may require uninstall.'
          fi
      - name: Lint, transaction tests, APK
        run: bash ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Package checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AppLexsa-debug.apk
          cd dist
          sha256sum AppLexsa-debug.apk > SHA256SUMS.txt
          echo "Commit: $GITHUB_SHA" > BUILD.txt
          if [[ -n "${LEXSA_KEYSTORE:-}" ]]; then echo 'Signing: stable test key' >> BUILD.txt; else echo 'Signing: ephemeral debug key' >> BUILD.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AppLexsa-debug-${{ github.run_number }}
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lexsa-test.jks"
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            bash ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.tovypytho.applexsa/files/screenshots app/build/reports/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-checks-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/screenshots/
          retention-days: 14
